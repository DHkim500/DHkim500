<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>연결 완료</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
  textarea { width: 100%; height: 120px; font-size: 13px; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h2>연결 완료</h2>
<p>아래 주소 전체를 복사해서 터미널에 붙여넣으세요.</p>
<textarea id="u" readonly></textarea>
<p><button id="b">주소 복사</button> <span id="m"></span></p>
<script>
  var t = document.getElementById("u");
  t.value = location.href;
  document.getElementById("b").onclick = function () {
    t.select();
    try { document.execCommand("copy"); document.getElementById("m").textContent = "복사됨"; } catch (e) {}
  };
</script>
</body>
</html>
